]

[[cli.familiar.commands]]
path = ["theme", "preview"]
summary = "Preview one member and its states"
args = [{ name = "member", value = "string", required = true }]
options = [
  { names = ["--theme"], value = "string" },
  { names = ["--state"], value = "string" },
]

[[cli.familiar.commands]]
path = ["theme", "sheet"]
summary = "Show every member across every state"
options = [
  { names = ["--rows"], value = "int" },
  { names = ["--theme"], value = "string" },
  { names = ["--member"], value = "string" },
  { names = ["--out"], value = "path" },
]

