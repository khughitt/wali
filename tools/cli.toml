[cli.prism]
project = "prism"
tier = "typed"
default_output = "pretty"
env = "PRISM"

[cli.familiar]
project = "fam"
tier = "typed"
default_output = "pretty"
env = "FAMILIAR"

[cli.forge]
project = "forge"
tier = "automation"
default_output = "pretty"
env = "FORGE"

[cli.relay]
project = "relay"
tier = "automation"
default_output = "pretty"
env = "RELAY"

[cli.obs]
project = "obs"
tier = "automation"
default_output = "pretty"
