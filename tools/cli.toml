# ---- forge

[[cli.forge.commands]]
path = ["graph"]
summary = "Project the graph, or check committed records"
options = [
  { names = ["--check"], value = "none" },
  { names = ["--partition"], value = "string", default = "all" },
  { names = ["--theme-graph"], value = "path" },
  { names = ["--sync-theme"], value = "none" },
]
exception = "check is a flag on the projection command rather than a verb, because the check re-derives the same graph"

[[cli.forge.commands]]
path = ["show"]
verb = "show"
summary = "Show one committed graph node"
args = [{ name = "node", value = "ref", required = true }]
options = [
  { names = ["--theme-graph"], value = "path" },
]

[[cli.forge.commands]]
path = ["seed"]
summary = "Seed a new exploration flow from a committed node"
args = [{ name = "dest-flow-dir", value = "path", required = true }]
options = [
  { names = ["--from"], value = "ref", required = true },
  { names = ["--member"], value = "string", required = true },
  { names = ["--goal"], value = "string", required = true },
  { names = ["--family"], value = "string", required = true },
  { names = ["--riff"], value = "string", required = true },
  { names = ["--namespace"], value = "string", required = true },
  { names = ["--model"], value = "string", default = "gpt-image" },
  { names = ["--floor-rows"], value = "int", default = "12" },
  { names = ["--body-plan"], value = "string", default = "cat" },
  { names = ["--reason"], value = "string" },
  { names = ["--theme-graph"], value = "path" },
]

# ---- relay

[[cli.relay.commands]]
path = ["list"]
verb = "list"
summary = "The live-agent registry"

[[cli.relay.commands]]
path = ["reap"]
summary = "Reconcile the registry against live processes"
options = [
  { names = ["--outer-ms"], value = "int" },
]

[[cli.relay.commands]]
path = ["hook"]
protocol = "harness hook: stdout is the reply, exit code is the guard's"
summary = "Dispatch one harness hook event to the subscribers and guards"
args = [{ name = "event", value = "string", required = true }]
options = [
  { shared = "harness", role = "select", value = "enum", values = ["claude-code", "codex", "opencode"], required = true, repeatable = false },
  { names = ["--outer-ms"], value = "int" },
  { names = ["--subscribers"], value = "path" },
]

[[cli.relay.commands]]
path = ["install"]
output = "json"
summary = "Plan, and with --apply write, a harness's hook installation"
options = [
  { shared = "harness", role = "select", value = "enum", values = ["claude-code", "codex", "opencode"], required = true, repeatable = false },
  { names = ["--subscribers"], value = "path", required = true },
  { names = ["--target"], value = "path" },
  { names = ["--config-dir"], value = "path" },
  { names = ["--evidence"], value = "path" },
  { names = ["--retire"], value = "enum", values = ["familiar"] },
  { names = ["--artifact"], value = "path" },
  { names = ["--apply"], value = "none" },
]

[[cli.relay.commands]]
path = ["rollback"]
output = "none"
summary = "Undo an applied installation from its artifact"
options = [
  { names = ["--artifact"], value = "path", required = true },
]
