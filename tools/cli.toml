# The shared CLI vocabulary and the inventory of every in-scope CLI's commands.
#
# Design: docs/specs/2026-09-20-cli-conventions-design.md. This file is the authority:
# each project vendors it byte-identical as tools/cli.toml and has one conformance test
# that builds its live parser surface and asserts set equality with its rows here. A new
# option or command anywhere is an edit here first, then a re-copy (`just vendor-cli`).
#
# Row shapes (spec "The table"):
#   option: names | shared (+ role), value, values, default, arity, repeatable, required, exception
#   arg:    name, value, values, required, variadic
#   command: path, summary, verb, output, protocol, exception, args, options
# `exception` carries the reason wherever a row departs from the vocabulary on purpose: on a
# command row for its verb, on a shared option row for a value kind that differs from the
# vocabulary entry's. Any other key on a row is a validation error.
# --json, --pretty, -h/--help, -V/--version, and --color on typed CLIs are implied by the
# CLI header and never rows; a protocol CLI implies only the help and version ones. The
# root `help` command is implied by the Help rule the same way and is never a row.

[vocabulary.values.when]
grammar = "YYYY-MM-DD | <n>d | <n>w"
meaning = "a calendar date, or a count of days or weeks back from today"

[vocabulary.values.age]
grammar = "<n>d | <n>w"
meaning = "a duration; 0d disables an age check"

[vocabulary.values.harness]
set = ["claude-code", "codex", "opencode"]

[vocabulary.values.color]
set = ["auto", "always", "never"]

[vocabulary.options.json]
names = ["--json"]
value = "none"
meaning = "emit exactly one JSON value on stdout"

[vocabulary.options.pretty]
names = ["--pretty"]
value = "none"
meaning = "emit text for a person"

[vocabulary.options.color]
names = ["--color"]
value = "enum"
values = "color"
default = "never"
meaning = "color pretty output"

[vocabulary.options.chdir]
names = ["-C"]
value = "path"
meaning = "run as if started in that directory"

[vocabulary.options.config]
names = ["--config"]
value = "path"
meaning = "read this configuration file instead of the default"

[vocabulary.options.limit]
names = ["--limit", "-n"]
value = "int"
meaning = "at most this many results; the default is per command"

[vocabulary.options.sort]
names = ["--sort"]
value = "enum"
meaning = "order rows by that field; the first value is the default"

[vocabulary.options.reverse]
names = ["--reverse"]
value = "none"
meaning = "reverse the chosen order; present wherever sort is"

[vocabulary.options.since]
names = ["--since"]
value = "when"
meaning = "inclusive lower bound on the command's time field"

[vocabulary.options.until]
names = ["--until"]
value = "when"
meaning = "inclusive upper bound on the command's time field"

[vocabulary.options.older_than]
names = ["--older-than"]
value = "age"
meaning = "only things older than this"

[vocabulary.options.newer_than]
names = ["--newer-than"]
value = "age"
meaning = "only things newer than this"

[vocabulary.options.seed]
names = ["--seed"]
value = "int"
meaning = "fix a random draw so it can be reproduced"

[vocabulary.options.status]
names = ["--status"]
value = "enum"
meaning = "a record's lifecycle status: filter a listing, or set it on add/edit"

[vocabulary.options.tag]
names = ["--tag"]
value = "string"
meaning = "a tag: filter a listing, or attach one on add/edit"

[vocabulary.options.project]
names = ["--project"]
value = "string"
meaning = "one registered project, by prefix"

[vocabulary.options.all_projects]
names = ["--all-projects"]
value = "none"
meaning = "every reachable registered project"

[vocabulary.options.harness]
names = ["--harness"]
value = "enum"
values = "harness"
meaning = "the agent harness a record belongs to; a command lists the subset it supports"

[vocabulary.options.all]
names = ["--all"]
value = "none"
meaning = "include what the default view hides"

[vocabulary.options.force]
names = ["--force"]
value = "none"
meaning = "override a refusal the command would otherwise make"

[vocabulary.options.by]
names = ["--by"]
value = "string"
meaning = "filter by author actor (mindful)"

[vocabulary.options.as]
names = ["--as"]
value = "string"
meaning = "the author actor of a write (mindful)"

[vocabulary.options.via]
names = ["--via"]
value = "string"
meaning = "the performer actor of a write (mindful)"

[vocabulary.roles]
set = ["filter", "set", "bound", "select"]
roled = ["status", "tag", "since", "until", "older_than", "newer_than", "sort", "project", "harness", "by"]

[vocabulary.verbs.list]
meaning = "many rows, filterable, one line each in pretty mode"

[vocabulary.verbs.show]
meaning = "one thing in full"

[vocabulary.verbs.add]
meaning = "create one thing"

[vocabulary.verbs.edit]
meaning = "change one thing"

[vocabulary.verbs.delete]
meaning = "remove one thing"

[vocabulary.verbs.check]
meaning = "validate; prints nothing and exits 0 when clean, findings otherwise"

[cli.tasks]
project = "tasks"
tier = "typed"
default_output = "json"
env = "TASKS"

[cli.mindful]
project = "mind6"
tier = "typed"
