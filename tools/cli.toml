args = [{ name = "dir", value = "path", required = false, variadic = true }]
options = [
  { names = ["--rows"], value = "int" },
  { names = ["--state"], value = "string" },
]

[[cli.familiar.commands]]
path = ["theme"]
summary = "Themes: list, add, validate, show, preview, sheet"

[[cli.familiar.commands]]
path = ["theme", "list"]
verb = "list"
summary = "List installed themes"

[[cli.familiar.commands]]
path = ["theme", "add"]
verb = "add"
summary = "Install a theme from an HTTPS URL or local directory"
args = [{ name = "source", value = "string", required = true }]

[[cli.familiar.commands]]
path = ["theme", "validate"]
summary = "Prove a theme directory conforms"
args = [{ name = "dir", value = "path", required = true }]

[[cli.familiar.commands]]
path = ["theme", "show"]
verb = "show"
summary = "Show a theme's twelve members"
args = [{ name = "id", value = "string", required = false }]
options = [
