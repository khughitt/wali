# ---- tasks

[[cli.tasks.commands]]
path = []
options = [
  { shared = "chdir", value = "path" },
]

[[cli.tasks.commands]]
path = ["init"]
summary = "Initialize tasks/ in this repository and register it"
options = [
  { names = ["--prefix"], value = "string" },
  { shared = "force", value = "none" },
]

[[cli.tasks.commands]]
path = ["rename"]
summary = "Rename a registered project's prefix and retain its retired names as aliases"
args = [{ name = "old", value = "ref", required = true }, { name = "new", value = "ref", required = true }]
options = [
  { names = ["--explain"], value = "none" },
]

[[cli.tasks.commands]]
path = ["unregister"]
summary = "Remove a prefix from the registry. Project files are left untouched"
args = [{ name = "prefix", value = "string", required = true }]

[[cli.tasks.commands]]
path = ["projects"]
summary = "The registry: every project, whether it is reachable, and its status counts"
options = [
  { shared = "sort", role = "select", value = "enum", values = ["prefix", "size", "activity"], default = "prefix" },
  { shared = "reverse", value = "none" },
  { names = ["--closed"], value = "none" },
  { names = ["--paths"], value = "none" },
]

[[cli.tasks.commands]]
path = ["root"]
summary = "The registered root of the project an id belongs to"
args = [{ name = "id", value = "ref", required = true }]

[[cli.tasks.commands]]
path = ["add"]
verb = "add"
summary = "Create a task"
args = [{ name = "title", value = "string", required = true }]
options = [
  { shared = "status", role = "set", value = "enum", values = ["idea", "todo"], default = "todo", repeatable = false },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { names = ["--body", "-b"], value = "string" },
  { names = ["--priority", "-p"], value = "enum", values = ["0", "1", "2", "3", "4"] },
  { names = ["--size"], value = "enum", values = ["xs", "s", "m", "l", "xl"] },
  { names = ["--complexity"], value = "enum", values = ["low", "mid", "high"] },
  { names = ["--process"], value = "enum", values = ["direct", "planned"] },
  { names = ["--parallel"], value = "none" },
  { names = ["--every"], value = "age", role = "set" },
  { names = ["--defer"], value = "when", role = "set" },
  { shared = "tag", role = "set", value = "string", repeatable = true },
  { names = ["--depends"], value = "ref", repeatable = true },
  { names = ["--spec"], value = "string" },
  { names = ["--plan"], value = "string" },
  { names = ["--step"], value = "string" },
  { names = ["--parent"], value = "ref" },
  { names = ["--source"], value = "string" },
  { names = ["--agent"], value = "string" },
]

[[cli.tasks.commands]]
path = ["show"]
verb = "show"
summary = "Show one task with resolved links and dependencies"
args = [{ name = "id", value = "ref", required = true }]

[[cli.tasks.commands]]
path = ["list"]
verb = "list"
summary = "List tasks (open by default)"
options = [
  { shared = "status", role = "filter", value = "enum", values = ["idea", "todo", "doing", "blocked", "shelved", "done", "dropped"], repeatable = true },
  { shared = "tag", role = "filter", value = "string", repeatable = true },
  { names = ["--owner"], value = "string" },
  { names = ["--source"], value = "string" },
  { names = ["--parent"], value = "ref" },
  { shared = "sort", role = "select", value = "enum", values = ["priority", "updated", "created"], default = "priority" },
  { shared = "reverse", value = "none" },
  { names = ["--parked"], value = "none" },
  { names = ["--periodic"], value = "none" },
  { names = ["--deferred"], value = "none" },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

[[cli.tasks.commands]]
path = ["ready"]
summary = "Actionable tasks: todo or due recurrences with all dependencies closed"
options = [
  { names = ["--size"], value = "enum", values = ["xs", "s", "m", "l", "xl"] },
  { names = ["--parallel"], value = "none" },
  { shared = "limit", value = "int" },
  { names = ["--max-complexity"], value = "enum", values = ["low", "mid", "high"] },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

[[cli.tasks.commands]]
path = ["next"]
summary = "The first ready task, in the show shape; null when nothing is ready"
options = [
  { names = ["--max-complexity"], value = "enum", values = ["low", "mid", "high"] },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

[[cli.tasks.commands]]
path = ["sample"]
summary = "Random open tasks for a curation pass: idea, todo, or blocked; not live-claimed; not updated within the --older-than age. Rows are list rows"
options = [
  { shared = "limit", value = "int", default = "3" },
  { shared = "older_than", role = "bound", value = "age", default = "7d", repeatable = false },
  { shared = "seed", value = "int" },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

[[cli.tasks.commands]]
path = ["edit"]
verb = "edit"
summary = "Edit fields, or open the task in $EDITOR when no field flags are given"
args = [{ name = "id", value = "ref", required = true }]
options = [
  { names = ["--title"], value = "string" },
  { shared = "status", role = "set", value = "enum", values = ["idea", "todo", "doing", "blocked", "done", "dropped"], repeatable = false },
  { shared = "force", value = "none" },
  { names = ["--no-parent"], value = "none" },
  { names = ["--no-parallel"], value = "none" },
  { names = ["--no-every"], value = "none" },
  { names = ["--no-defer"], value = "none" },
  { names = ["--no-source"], value = "none" },
  { names = ["--no-agent"], value = "none" },
  { names = ["--no-complexity"], value = "none" },
  { names = ["--no-process"], value = "none" },
  { names = ["--model"], value = "string" },
  { names = ["--no-model"], value = "none" },
  { names = ["--rm-tag"], value = "string", repeatable = true },
  { names = ["--no-tags"], value = "none" },
  { names = ["--body", "-b"], value = "string" },
  { names = ["--priority", "-p"], value = "enum", values = ["0", "1", "2", "3", "4"] },
  { names = ["--size"], value = "enum", values = ["xs", "s", "m", "l", "xl"] },
  { names = ["--complexity"], value = "enum", values = ["low", "mid", "high"] },
  { names = ["--process"], value = "enum", values = ["direct", "planned"] },
  { names = ["--parallel"], value = "none" },
  { names = ["--every"], value = "age", role = "set" },
  { names = ["--defer"], value = "when", role = "set" },
  { shared = "tag", role = "set", value = "string", repeatable = true },
  { names = ["--depends"], value = "ref", repeatable = true },
  { names = ["--spec"], value = "string" },
  { names = ["--plan"], value = "string" },
  { names = ["--step"], value = "string" },
  { names = ["--parent"], value = "ref" },
  { names = ["--source"], value = "string" },
  { names = ["--agent"], value = "string" },
]

[[cli.tasks.commands]]
path = ["note"]
summary = "Append a timestamped note"
args = [{ name = "id", value = "ref", required = true }, { name = "text", value = "string", required = true }]

[[cli.tasks.commands]]
path = ["start"]
summary = "Claim a task: status=doing, owner=you"
args = [{ name = "id", value = "ref", required = true }]
options = [
  { shared = "force", value = "none" },
]

[[cli.tasks.commands]]
path = ["park"]
summary = "Set a task down: record the next step, who it waits on, and this session in the shared store. Status is untouched; `start` resumes it"
args = [{ name = "id", value = "ref", required = true }, { name = "next-step", value = "string", required = true }]
options = [
  { names = ["--waiting-on"], value = "enum", values = ["agent", "user"], default = "agent" },
  { names = ["--reason"], value = "enum", values = ["review", "decision", "approval", "environment", "dependency", "session", "capability", "quiet"] },
  { names = ["--complexity"], value = "enum", values = ["low", "mid", "high"] },
  { names = ["--needs"], value = "enum", values = ["idle", "headless"] },
  { names = ["--minutes"], value = "int" },
]

[[cli.tasks.commands]]
path = ["done"]
summary = "Close a task as done"
args = [{ name = "id", value = "ref", required = true }, { name = "message", value = "string", required = false }]
options = [
  { shared = "force", value = "none" },
]

[[cli.tasks.commands]]
path = ["drop"]
summary = "Close a task as dropped"
args = [{ name = "id", value = "ref", required = true }, { name = "message", value = "string", required = false }]

[[cli.tasks.commands]]
path = ["block"]
summary = "Mark a task blocked"
args = [{ name = "id", value = "ref", required = true }, { name = "message", value = "string", required = false }]

[[cli.tasks.commands]]
path = ["unblock"]
summary = "Return a blocked task to todo"
args = [{ name = "id", value = "ref", required = true }]

[[cli.tasks.commands]]
path = ["shelve"]
summary = "Put a task out of active work: status=shelved, hidden from the default views, open for dependencies. The wake condition is required and becomes the note"
args = [{ name = "id", value = "ref", required = true }, { name = "wake", value = "string", required = true }]

[[cli.tasks.commands]]
path = ["unshelve"]
summary = "Return a shelved task to idea"
args = [{ name = "id", value = "ref", required = true }]

[[cli.tasks.commands]]
path = ["dep"]
summary = "Add or remove dependencies"
args = [{ name = "id", value = "ref", required = true }]
options = [
  { names = ["--on"], value = "ref", arity = "1..", repeatable = true },
  { names = ["--rm"], value = "ref", arity = "1..", repeatable = true },
]

[[cli.tasks.commands]]
path = ["graph"]
summary = "Dependency graph as mermaid or dot"
options = [
  { names = ["--format"], value = "enum", values = ["mermaid", "dot"], default = "mermaid" },
  { shared = "all", value = "none" },
]

[[cli.tasks.commands]]
path = ["check"]
verb = "check"
summary = "Validate every task file. Prints nothing when there is nothing to report"

[[cli.tasks.commands]]
path = ["prime"]
summary = "Session context for agents"
options = [
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
  { names = ["--closed"], value = "none" },
]

[[cli.tasks.commands]]
path = ["feedback"]
summary = "File feedback about the tasks tool itself into the upstream tasks project"
args = [{ name = "summary", value = "string", required = true }]
options = [
  { names = ["--category"], value = "enum", values = ["friction", "gap", "idea", "positive"], required = true },
  { names = ["--body", "-b"], value = "string" },
  { names = ["--recur"], value = "ref" },
  { names = ["--new"], value = "none" },
]

[[cli.tasks.commands]]
path = ["tree"]
summary = "The task hierarchy as nested nodes (open work only unless --all)"
args = [{ name = "id", value = "ref", required = false }]
options = [
  { shared = "all", value = "none" },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

[[cli.tasks.commands]]
path = ["tags"]
summary = "Tag frequencies (open tasks unless --status), per project"
options = [
  { shared = "status", role = "filter", value = "enum", values = ["idea", "todo", "doing", "blocked", "shelved", "done", "dropped"], repeatable = true },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

[[cli.tasks.commands]]
path = ["quiet"]
summary = "Work parked waiting for an idle host, as resume briefs"
options = [
  { shared = "limit", value = "int" },
  { shared = "project", role = "select", value = "string", repeatable = false },
  { shared = "all_projects", value = "none" },
]

